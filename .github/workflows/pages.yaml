on:
    push:
        branches:
            - main

name: Pages

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: |-
                mkdir -p pagedist/doc/
                cp doc/index.html docdist/index.html
                cp doc/index.html docdist/doc/index.html
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: pagedist

    deploy:
        runs-on: ubuntu-latest
        needs: build
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment
