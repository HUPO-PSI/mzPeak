[project]

name = "mzpeak"
version = "0.2.0"

dependencies = [
    "pyarrow>=20",
    "pandas",
    "numpy",
    "scipy",
    "psims",
]

license = "Apache-2.0"

[project.scripts]
mzpeak-provenance-python = "mzpeak.provenance_cli:main"

[project.optional-dependencies]
sql = ["datafusion"]
cli = ["click"]
numpress = ["pynumpress"]
upath = ["universal_pathlib"]
test = ["pytest", "pyteomics"]
provenance = ["asn1crypto", "cryptography"]